name: Release MyRunSync APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (SemVer, e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release tag and signing secrets
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag '$TAG' must match SemVer format vMAJOR.MINOR.PATCH (e.g. v1.0.0)."
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$(( 10#${MAJOR} * 10000 + 10#${MINOR} * 100 + 10#${PATCH} ))

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required repository secret: $var"
              exit 1
            fi
          done

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Download optional Samsung Health Data SDK AAR
        shell: bash
        env:
          SAMSUNG_HEALTH_SDK_AAR_URL: ${{ secrets.SAMSUNG_HEALTH_SDK_AAR_URL }}
          SAMSUNG_HEALTH_SDK_AUTH_HEADER: ${{ secrets.SAMSUNG_HEALTH_SDK_AUTH_HEADER }}
        run: |
          set -euo pipefail
          if [ -n "${SAMSUNG_HEALTH_SDK_AAR_URL:-}" ]; then
            mkdir -p MyRunSync/app/libs
            AAR_DEST="MyRunSync/app/libs/samsung-health-data-api-1.1.0.aar"
            if [ -n "${SAMSUNG_HEALTH_SDK_AUTH_HEADER:-}" ]; then
              curl -fsSL -H "$SAMSUNG_HEALTH_SDK_AUTH_HEADER" "$SAMSUNG_HEALTH_SDK_AAR_URL" -o "$AAR_DEST"
            else
              curl -fsSL "$SAMSUNG_HEALTH_SDK_AAR_URL" -o "$AAR_DEST"
            fi
            if ! unzip -tq "$AAR_DEST" >/dev/null 2>&1; then
              echo "::error::Downloaded Samsung Health SDK AAR is not a valid archive. Check SAMSUNG_HEALTH_SDK_AAR_URL / auth secret."
              exit 1
            fi
            echo "EXPECT_SAMSUNG_SDK=true" >> "$GITHUB_ENV"
            echo "Downloaded valid Samsung Health Data SDK AAR ($(wc -c < "$AAR_DEST") bytes)."
          else
            echo "EXPECT_SAMSUNG_SDK=false" >> "$GITHUB_ENV"
            echo "SAMSUNG_HEALTH_SDK_AAR_URL secret not set; building Health Connect variant."
          fi

      - name: Run unit tests and build signed Release APK
        working-directory: MyRunSync
        shell: bash
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease

          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected signed APK not found at $APK_PATH"
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify "$APK_PATH"

          RELEASE_BC="app/build/generated/source/buildConfig/release/com/myrunsync/BuildConfig.java"
          if ! grep -q 'SUPABASE_URL = ""' "$RELEASE_BC" || ! grep -q 'SUPABASE_ANON_KEY = ""' "$RELEASE_BC"; then
            echo "::error::Release BuildConfig must have empty SUPABASE_URL and SUPABASE_ANON_KEY."
            exit 1
          fi
          if [ "${EXPECT_SAMSUNG_SDK:-false}" = "true" ] && ! grep -q 'SAMSUNG_HEALTH_SDK_ENABLED = true' "$RELEASE_BC"; then
            echo "::error::Expected SAMSUNG_HEALTH_SDK_ENABLED = true in Release BuildConfig."
            exit 1
          fi

          cp "$APK_PATH" "${RUNNER_TEMP}/MyRunSync-${TAG}.apk"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="${RUNNER_TEMP}/MyRunSync-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "MyRunSync ${TAG}" \
              --generate-notes
          fi

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/release.jks"
